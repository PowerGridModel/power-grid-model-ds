name: Sonar Cloud

on:
  push:
    branches:
      - main
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-sonar
  cancel-in-progress: true

jobs:
  sonar-cloud:

    runs-on: ubuntu-latest
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: ${{ always() }}
        with:
          activate-environment: true
          enable-cache: true

      - name: install poe
        run: uv tool install poethepoet

      - name: Install dependencies
        if: ${{ always() }}
        run: uv sync --frozen --dev

      - name: Test and Coverage
        run: |
          poe coverage
          uv run coverage xml 

      - name: SonarCloud Scan
        if: ${{ (github.event_name == 'push') || (github.event.pull_request.head.repo.owner.login == 'PowerGridModel') }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
